spring.application.name=rate-limiter

server.port=8080

# ---- Redis connection ----
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ---- Token Bucket configuration ----
# Maximum number of tokens the bucket can hold (burst capacity)
ratelimiter.bucket-capacity=10
# Tokens added back per second (sustained request rate)
ratelimiter.refill-rate=2
# Number of tokens consumed per request
ratelimiter.tokens-per-request=1
# TTL (seconds) for the Redis key so idle clients' state is auto-cleaned
ratelimiter.key-ttl-seconds=3600

logging.level.com.ssn.ratelimiter=INFO
